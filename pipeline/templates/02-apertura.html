<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="page opener">
    <div class="op-inner">
      <div class="op-head">
        <div class="kicker ch-num">Capítulo {{ capitulo.romano }}</div>
        <h1 class="ch-name">{{ capitulo.nombre }}</h1>
      </div>

      <div class="op-seal">
        <img src="assets/sello-completo_transp.png" alt="" />
      </div>

      {% if capitulo.cita %}
      <p class="op-quote">“{{ capitulo.cita }}”</p>
      {% endif %}
    </div>

    <div class="folio">{{ capitulo.folio | default(capitulo.numero) }}</div>
  </div>
</body>
</html>
